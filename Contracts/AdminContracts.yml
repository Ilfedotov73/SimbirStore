                task: 'РегистрацияПродавца'
                vendorId: 95
                vendor:
                  id: 10
                  firstName: 'Имя'
                  lastName: 'Фамилия'
                  phoneNumber: +79998887766
                  photoUrl: 'https://example.com/vendor1.jpg'
                  vendorTelegramId: '@someuser'
                  login: 'somelogin'
                  email: 'sudo@example.com'
                  password: 'somepassword'
                deadline: '2025-12-01T00:00:00Z'
                status: 'BEING_PROCESSED'
                createAt: '2025-11-20T12:00:00Z'
        '404':
          description: Задача не найдена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Невозможно зарегистрировать продавца
          content:
