        '500':
          description: Невозможно назначить задачу на администратора
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                code: ALREADY_ASSIGNED
                message: This task was already assigned to administrator

  /vendor/accept/{taskId}:
    post:
      summary: Зарегистрировать продавца
      description: Подтверждает регистрацию продавца
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
      responses:
